name: check

# EPIC 10-1: runs `npm run check` on every push and pull request. Merging into
# main is blocked until it passes (branch protection on main).
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Chromium for the end-to-end tests
        run: npx playwright install --with-deps chromium

      - run: npm run check
