<sc-if value="{{barDoc}}" hint-placeholder-val="{{ false }}">
<div style="flex: none; display: flex; flex-direction: column; gap: 8px; padding: 12px {{L.padX}}px 16px; background: #FFFFFF; border-top: 1px solid #DDD8CE">
<sc-if value="{{barEditHint}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 13px; color: #5E5A52">고치는 중인 항목을 먼저 적용하거나 취소하세요.</p></sc-if>
<div style="display: flex; gap: 10px; justify-content: flex-end">
<sc-if value="{{scr.review}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{download}}" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; flex: {{L.barBtnFlex}}; min-height: 52px; padding: 0 16px; border: 1px solid #C9C3B6; border-radius: 12px; background: #FFFFFF; color: #1C1B18; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M12 4v11"></path><path d="M7.5 10.5L12 15l4.5-4.5"></path><path d="M5 20h14"></path></svg>.md 내려받기</button>
<button type="button" onClick="{{openSend}}" disabled="{{editingAny}}" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; flex: {{L.barBtnFlex}}; min-height: 52px; padding: 0 20px; border: 1px solid #26489A; border-radius: 12px; background: #26489A; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; opacity: {{sendOpacity}}; cursor: {{sendCursor}}"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3.5 7l8.5 6 8.5-6"></path></svg>메일 보내기</button>
</sc-if>
<sc-if value="{{scr.done}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{askLeave}}" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; flex: {{L.barBtnFlex}}; min-height: 52px; padding: 0 16px; border: 1px solid #C9C3B6; border-radius: 12px; background: #FFFFFF; color: #1C1B18; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">새 회의록</button>
<button type="button" onClick="{{download}}" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; flex: {{L.barBtnFlex}}; min-height: 52px; padding: 0 20px; border: 1px solid #1C1B18; border-radius: 12px; background: #1C1B18; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M12 4v11"></path><path d="M7.5 10.5L12 15l4.5-4.5"></path><path d="M5 20h14"></path></svg>.md 내려받기</button>
</sc-if>
</div>
</div>
</sc-if>

<sc-if value="{{toast}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; left: 50%; bottom: {{L.toastBottom}}px; z-index: 15; transform: translateX(-50%); box-sizing: border-box; width: {{L.toastW}}; display: flex; align-items: center; gap: 12px; padding: 10px 8px 10px 18px; background: #1C1B18; color: #F4F2EC; border-radius: 14px; box-shadow: 0 12px 32px rgba(28, 27, 24, 0.3)">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M12 4v11"></path><path d="M7.5 10.5L12 15l4.5-4.5"></path><path d="M5 20h14"></path></svg>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.45">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500; overflow-wrap: anywhere">{{fileName}} 내려받기</span>
<span style="font-size: 12px; color: #CFC9BD">시안이라 실제 파일은 만들어지지 않습니다. 전체 스크립트까지 담긴 파일입니다.</span>
</div>
<button type="button" aria-label="알림 닫기" onClick="{{closeToast}}" style="display: inline-flex; align-items: center; justify-content: center; flex: none; width: 44px; height: 44px; padding: 0; border: none; border-radius: 10px; background: transparent; color: #F4F2EC; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</sc-if>

<sc-if value="{{mo.open}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; z-index: 20; box-sizing: border-box; display: flex; align-items: {{L.ovAlign}}; justify-content: center; padding: {{L.ovPad}}; background: rgba(28, 27, 24, 0.5)">
<div role="dialog" aria-modal="true" aria-labelledby="dlg-title" style="box-sizing: border-box; width: {{L.sheetW}}; max-height: 88%; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding: {{L.sheetPad}}; background: #FFFFFF; border-radius: {{L.sheetR}}; box-shadow: 0 24px 60px rgba(28, 27, 24, 0.25)">

<sc-if value="{{mo.picker}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
<span style="align-self: flex-start; display: inline-flex; align-items: center; padding: 2px 10px; border: 1px dashed #8A857A; border-radius: 999px; font-size: 12px; font-weight: 600; color: #5E5A52">시안용 파일 선택 창</span>
<h2 id="dlg-title" style="margin: 0; font-size: 20px; line-height: 1.4; font-weight: 700">녹음 파일 고르기</h2>
</div>
<button type="button" aria-label="닫기" onClick="{{closeModal}}" style="display: inline-flex; align-items: center; justify-content: center; flex: none; width: 44px; height: 44px; margin: -8px -8px 0 0; padding: 0; border: none; border-radius: 10px; background: transparent; color: #3D3A34; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<p style="margin: 0; font-size: 14px; color: #5E5A52">실제 서비스에서는 기기의 파일 선택 창이 열립니다. 시안에서는 아래 예시 파일 중 하나를 고르세요.</p>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{pickFiles}}" as="f" hint-placeholder-count="4"><li><button type="button" onClick="{{f.pick}}" style="box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 10px 14px; font: inherit; text-align: left; color: #1C1B18; background: #FFFFFF; border: 1px solid #DDD8CE; border-radius: 12px; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path><path d="M9 17v-3M12 17v-5M15 17v-2"></path></svg><span style="flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere">{{f.name}}</span><span style="{{f.tagStyle}}">{{f.tag}}</span></button></li></sc-for>
</ul>
<p style="margin: 0; font-size: 13px; color: #5E5A52">지원 형식은 mp3, m4a, wav입니다.</p>
</sc-if>

<sc-if value="{{mo.confirmB}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px; background: #FBEDE3; color: #8F3C10; font-size: 13px; font-weight: 600">바로 보내기 · 검토 없이 발송</span>
<h2 id="dlg-title" style="margin: 0; font-size: 20px; line-height: 1.4; font-weight: 700">올리기 전에 받는 주소를 확인하세요</h2>
</div>
<button type="button" aria-label="닫기" onClick="{{closeModal}}" style="display: inline-flex; align-items: center; justify-content: center; flex: none; width: 44px; height: 44px; margin: -8px -8px 0 0; padding: 0; border: none; border-radius: 10px; background: transparent; color: #3D3A34; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<p style="margin: 0; color: #3D3A34">회의록이 만들어지면 <strong>사람의 검토 없이</strong> 아래 주소로 곧바로 보냅니다. 주소가 맞는지 확인한 뒤 올리세요.</p>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 14px; background: #FBEDE3; border: 1.5px solid #EDC3A6">
<p style="margin: 0; font-weight: 700; color: #8F3C10">받는 사람 {{rcpCount}}명</p>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{rcps}}" as="r" hint-placeholder-count="3"><li style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: #FFFFFF; font-size: 15px; font-weight: 600; overflow-wrap: anywhere"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; color: #B84E17; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3.5 7l8.5 6 8.5-6"></path></svg><span style="min-width: 0">{{r.email}}</span></li></sc-for>
</ul>
</div>
<dl style="margin: 0; display: grid; grid-template-columns: {{L.dlCols}}; gap: 6px 12px; font-size: 14px">
<dt style="color: #5E5A52">녹음 파일</dt><dd style="margin: 0; overflow-wrap: anywhere">{{fileLabel}}</dd>
<dt style="color: #5E5A52">메일 구성</dt><dd style="margin: 0">본문에 요약 · 결정사항 · 할 일, 전체 회의록 .md 파일 첨부</dd>
</dl>
<div style="display: flex; flex-direction: {{L.actDir}}; justify-content: flex-end; gap: 10px">
<button type="button" onClick="{{closeModal}}" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border: 1px solid #C9C3B6; border-radius: 12px; background: #FFFFFF; color: #1C1B18; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">주소 고치기</button>
<button type="button" onClick="{{confirmGo}}" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border: 1px solid #B84E17; border-radius: 12px; background: #B84E17; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">이 주소로 올리고 보내기</button>
</div>
<p style="margin: 0; font-size: 12px; color: #5E5A52; text-align: center">시안: 실제로 올리거나 보내지 않습니다.</p>
</sc-if>

<sc-if value="{{mo.send}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px; background: #E8EDF8; color: #1E3A7E; font-size: 13px; font-weight: 600">검토 후 보내기</span>
<h2 id="dlg-title" style="margin: 0; font-size: 20px; line-height: 1.4; font-weight: 700">이 내용으로 메일을 보낼까요?</h2>
</div>
<button type="button" aria-label="닫기" onClick="{{closeModal}}" style="display: inline-flex; align-items: center; justify-content: center; flex: none; width: 44px; height: 44px; margin: -8px -8px 0 0; padding: 0; border: none; border-radius: 10px; background: transparent; color: #3D3A34; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<dl style="margin: 0; display: grid; grid-template-columns: {{L.dlCols}}; gap: 12px 14px; font-size: 14px">
<dt style="color: #5E5A52">받는 사람</dt>
<dd style="margin: 0"><ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{rcps}}" as="r" hint-placeholder-count="3"><li style="padding: 4px 12px; border-radius: 999px; background: #F1EFE9; overflow-wrap: anywhere">{{r.email}}</li></sc-for></ul></dd>
<dt style="color: #5E5A52">메일 제목</dt><dd style="margin: 0; font-weight: 600; overflow-wrap: anywhere">{{mailSubject}}</dd>
<dt style="color: #5E5A52">본문</dt><dd style="margin: 0">제목, 일시, 참석자, 요약, 결정사항, 할 일<br>전체 스크립트는 본문에 넣지 않습니다.</dd>
<dt style="color: #5E5A52">첨부</dt><dd style="margin: 0"><code style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; overflow-wrap: anywhere">{{fileName}}</code><br>화면에서 내려받는 파일과 같습니다.</dd>
</dl>
<p style="margin: 0; display: flex; gap: 8px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; background: #E8EDF8; color: #1E3A7E; font-size: 14px"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; margin-top: 2px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5.5"></path><path d="M12 7.5h.01"></path></svg><span>화면에서 고친 내용이 메일 본문과 첨부 파일에 그대로 들어갑니다.</span></p>
<div style="display: flex; flex-direction: {{L.actDir}}; justify-content: flex-end; gap: 10px">
<button type="button" onClick="{{closeModal}}" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border: 1px solid #C9C3B6; border-radius: 12px; background: #FFFFFF; color: #1C1B18; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">취소</button>
<button type="button" onClick="{{doSend}}" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border: 1px solid #26489A; border-radius: 12px; background: #26489A; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3.5 7l8.5 6 8.5-6"></path></svg>보내기</button>
</div>
<p style="margin: 0; font-size: 12px; color: #5E5A52; text-align: center">시안: 실제로 보내지 않습니다.</p>
</sc-if>

<sc-if value="{{mo.leave}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<h2 id="dlg-title" style="margin: 0; font-size: 20px; line-height: 1.4; font-weight: 700">처음 화면으로 갈까요?</h2>
<button type="button" aria-label="닫기" onClick="{{closeModal}}" style="display: inline-flex; align-items: center; justify-content: center; flex: none; width: 44px; height: 44px; margin: -8px -8px 0 0; padding: 0; border: none; border-radius: 10px; background: transparent; color: #3D3A34; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<sc-if value="{{lv.form}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; color: #3D3A34">고른 녹음 파일과 입력한 회의 정보, 받는 주소가 모두 지워집니다.</p></sc-if>
<sc-if value="{{lv.review}}" hint-placeholder-val="{{ true }}"><p style="margin: 0; color: #3D3A34">회의록은 서비스에 보관되지 않습니다. 메일을 보내거나 .md 파일로 내려받지 않고 나가면 이 회의록을 다시 볼 수 없습니다.</p></sc-if>
<sc-if value="{{lv.done}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; color: #3D3A34">회의록은 서비스에 보관되지 않습니다. 나간 뒤에는 보낸 메일과 내려받은 파일로만 볼 수 있습니다.</p></sc-if>
<div style="display: flex; flex-direction: {{L.actDir}}; justify-content: flex-end; gap: 10px">
<button type="button" onClick="{{closeModal}}" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border: 1px solid #C9C3B6; border-radius: 12px; background: #FFFFFF; color: #1C1B18; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">머무르기</button>
<button type="button" onClick="{{goHome}}" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border: 1px solid #1C1B18; border-radius: 12px; background: #1C1B18; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">처음으로</button>
</div>
</sc-if>

</div>
</div>
</sc-if>

</div>
</template>

      const missingFile = !file;
      const noRcp = r.list.length === 0;
      const patch = { recipients: r.list, rcpDraft: r.draft, rcpError: r.err, errFile: missingFile, errRcp: noRcp };

      set(Object.assign(patch, { screen: 'processing', m: buildM(), editing: null, draft: null }));
    };

    const formEmpty = !file && !clean(st.title) && !clean(st.date) && !st.attendees.length && !st.recipients.length && !clean(st.attDraft) && !clean(st.rcpDraft);

    }));

    }));
    const rcpErrMsg = st.rcpError || (st.errRcp && rcpCount === 0 ? '받는 메일 주소를 1개 이상 입력해 주세요.' : '');

    const pickFiles = [
      { name: '주간회의_0922.m4a', ext: 'm4a' },
      { name: '기획회의_0918.mp3', ext: 'mp3' },
      { name: '인터뷰_녹음.wav', ext: 'wav' },
      { name: '화면녹화_0922.mp4', ext: 'mp4' }
    ].map((f) => {
      const ok = OK.indexOf(f.ext) >= 0;
      return {
        name: f.name,
        tag: ok ? '지원 형식' : '지원 안 함',

    const m = st.m;

    const E = { meta: ed === 'meta', summary: ed === 'summary', decisions: ed === 'decisions', todos: ed === 'todos' };
    const mv = {
      title: m.title,
      date: show(m.date), dateStyle: undef(m.date) ? U : '',
      attendees: show(m.attendees), attStyle: undef(m.attendees) ? U : '',

      decs: m.decisions.map((x) => ({ text: x.text, ts: x.ts, hasTs: !!x.ts })),

      todos: m.todos.map((x) => ({

      set({ editing: sec, draft: draft, toast: false });

    const cleanTs = (v) => clean(v).replace(/[\[\]`]/g, '');
    const applyEdit = () => {
      const d0 = st.draft || {};
      const nm = clone(m);
      if (ed === 'meta') {
        nm.title = clean(d0.title) || nm.title;
        nm.date = clean(d0.date) || '미정';
        nm.attendees = clean(d0.attendees) || '미정';
      }
      if (ed === 'summary') nm.summary = (d0.summary || []).map((x) => clean(x.text)).filter((x) => x);

      todos: (d.todos || []).map((x, i) => ({

        onTask: upd('todos', i, 'task'), onOwner: upd('todos', i, 'owner'), onDue: upd('todos', i, 'due'),

    return {

      setModeB: () => set({ mode: 'B' }),
      tabA: tabA, tabB: tabB,

      noFile: !file, hasFile: !!file,
      fileLabel: file ? file.name : '',

      fileBorder: fileBad ? '#B3261E' : '#DDD8CE',
      fileBg: fileBad ? '#FBEAE8' : '#FAF9F6',
      fileIconColor: fileBad ? '#B3261E' : '#3D3A34',
      fileMetaColor: fileBad ? '#B3261E' : '#5E5A52',
      dropBorder: st.errFile && !file ? '#B3261E' : '#A39C8F',
      fileErrShow: !!fileErrMsg, fileErrMsg: fileErrMsg,
      fileSummary: file ? file.name : '아직 고르지 않았습니다',
      openPicker: () => set({ modal: 'picker' }),
      removeFile: () => set({ file: null }),
      pickFiles: pickFiles,

      title: st.title, onTitle: (e) => set({ title: e.target.value }),
      date: st.date, onDate: (e) => set({ date: e.target.value }),
      atts: atts, attHas: atts.length > 0,
      attDraft: st.attDraft,
      onAttDraft: (e) => set({ attDraft: e.target.value }),
      onAttKey: (e) => { if (composing(e)) return; if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addAtt(); } },
      addAtt: addAtt,

      rcps: rcps, rcpCount: rcpCount, rcpHas: rcpCount > 0, rcpNone: rcpCount === 0,
      rcpSummary: rcpCount ? rcpCount + '명' : '아직 없습니다',
      rcpDraft: st.rcpDraft,
      onRcpDraft: (e) => set({ rcpDraft: e.target.value, rcpError: '' }),
      onRcpKey: (e) => { if (composing(e)) return; if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addRcp(); } },
      addRcp: addRcp,
      rcpBorder: isB ? '1.5px solid #EDC3A6' : '1px solid #DDD8CE',
      rcpInputBorder: st.rcpError ? '#B3261E' : '#C9C3B6',
      rcpInvalid: !!st.rcpError,
      rcpErrShow: !!rcpErrMsg, rcpErrMsg: rcpErrMsg,
      submit: submit,
      barForm: scr.form && !isPC,
      barDoc: scr.doc && !isPC,
      barEditHint: scr.review && editingAny,

      modeColor: isB ? '#B84E17' : '#26489A',
      procCurBg: isB ? '#FDF6F1' : '#F6F8FD',
      curTag: 'flex: none; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; ' + (isB ? 'background: #FBEDE3; color: #8F3C10' : 'background: #E8EDF8; color: #1E3A7E'),
      procNext: () => set({ screen: isB ? 'resultB' : 'review' }),
      confirmGo: () => set({ modal: null, screen: 'processing', m: buildM(), editing: null, draft: null }),

      mv: mv, V: V, E: E, dv: dv, canEdit: canEdit,
      editMeta: startEdit('meta'), editSummary: startEdit('summary'),
      editDecisions: startEdit('decisions'), editTodos: startEdit('todos'),
      addSummary: addRow('summary', { text: '' }),
      addDecision: addRow('decisions', { text: '', ts: '' }),
      addTodo: addRow('todos', { task: '', owner: '', due: '', ts: '' }),
      cancelEdit: () => set({ editing: null, draft: null }),

      script: this.scriptLines(),

      fileName: fileName, mailSubject: mailSubject,
      editingAny: editingAny,
      sendOpacity: editingAny ? '0.45' : '1',
      sendCursor: editingAny ? 'not-allowed' : 'pointer',
      openSend: () => { if (!ed) set({ modal: 'send', toast: false }); },
      doSend: () => set({ modal: null, screen: 'sentA', toast: false }),
      download: () => set({ toast: true }),
      toast: !!st.toast,
      closeToast: () => set({ toast: false }),

      mo: { open: !!st.modal, picker: st.modal === 'picker', confirmB: st.modal === 'confirmB', send: st.modal === 'send', leave: st.modal === 'leave' },
      lv: { form: st.leaveFrom === 'form', review: st.leaveFrom === 'review', done: st.leaveFrom === 'sentA' || st.leaveFrom === 'resultB' }
    };
  }
}
</script>
<script>
(function () {
  var W = 834, H = 1194;
  var stage = document.getElementById('stage'), frame = document.getElementById('frame');
  function fit() {
    var s = Math.min((stage.clientWidth - 32) / W, (stage.clientHeight - 32) / H, 1);
    frame.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();
  window.__mountPrototype(Component, { device: "tablet", start: "home" });
})();
</script>
